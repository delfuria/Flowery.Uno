version: 2
updates:
  - package-ecosystem: "nuget"
    # The solution covers nine projects; the other three need explicit entries.
    directories:
      - "/"
      - "/Flowery.Uno.Kiosk.Browser"
      - "/Tools/IconGenerator"
      - "/Tools/PatternGenerator"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      uno:
        patterns:
          - "Uno.*"
      mstest:
        patterns:
          - "MSTest*"
          - "Microsoft.Testing.*"
          - "Combinatorial.MSTest"
      skia:
        patterns:
          - "SkiaSharp*"
          - "HarfBuzzSharp*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      compatible-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
